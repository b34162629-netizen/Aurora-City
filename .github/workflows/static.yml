function push(o,r){let hit=0;for(const s of solids){const nx=cl(o.x,s.x0,s.x1),nz=cl(o.z,s.z0,s.z1),dx=o.x-nx,dz=o.z-nz,d=Math.hypot(dx,dz);if(d<r){if(d>1e-4){o.x+=dx/d*(r-d);o.z+=dz/d*(r-d)}else o.x=s.x0-r;hit=1}}return hit}
