<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurora City — Open World</title>
<style>
:root{--ac:#ffb347;--pn:rgba(8,12,20,.72);--tx:#eaf0ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#05070c;color:var(--tx);font:14px system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.p{background:var(--pn);backdrop-filter:blur(8px);border:1px solid #fff2;border-radius:10px;padding:8px 12px}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0px) 0 0}
.hide{display:none!important}
#st{position:absolute;left:14px;top:14px;width:230px}
.bar{height:10px;background:#0006;border-radius:6px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e5484d,#ff8a65)}.bar.x i{background:linear-gradient(90deg,#4cc9f0,#7b8cff)}
#inf{position:absolute;left:14px;top:96px;font-weight:600}
#mm{position:absolute;right:14px;top:14px;border-radius:50%;border:2px solid #fff4;background:#0008}
#ob{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center;max-width:44vw}
#ob small{color:var(--ac)}
#sp{position:absolute;right:20px;bottom:20px;font-size:34px;font-weight:700;text-shadow:0 2px 8px #000}
#pr{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);font-weight:700;text-shadow:0 2px 8px #000}
#dl{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);width:min(620px,90vw);font-size:16px;display:none}
#ts{position:absolute;left:50%;top:80px;transform:translateX(-50%);color:var(--ac);font-weight:700;font-size:18px;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .4s}#ts.s{opacity:1}
#fl{position:fixed;inset:0;background:radial-gradient(transparent 40%,#d00a);opacity:0;pointer-events:none;transition:opacity .4s}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(#0008,#000b);z-index:5}
.scr h1{font-size:clamp(40px,9vw,92px);letter-spacing:.2em;margin:0;font-weight:200}.scr h1 b{color:var(--ac);font-weight:800}
.scr h2{margin:0 0 6px;letter-spacing:.2em;font-weight:300}
.scr p{margin:0 0 14px;opacity:.7;max-width:520px;text-align:center;line-height:1.5}
button{width:260px;padding:13px;border:1px solid #fff3;background:#ffffff12;color:var(--tx);font:600 15px system-ui;letter-spacing:.12em;border-radius:8px;cursor:pointer;transition:.2s}
button:hover:not(:disabled){background:var(--ac);color:#111;transform:translateX(6px)}button:disabled{opacity:.35}
label{display:flex;justify-content:space-between;gap:20px;width:300px;align-items:center}
#tc{position:fixed;inset:0;pointer-events:none;display:none}
#tc div{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;background:#fff2;border:1px solid #fff5;display:flex;align-items:center;justify-content:center;font-weight:700}
#js{left:24px;bottom:30px;width:120px;height:120px}#jk{position:absolute;width:50px;height:50px;border-radius:50%;background:#fff6}
#t1{right:24px;bottom:30px;width:70px;height:70px}#t2{right:110px;bottom:60px;width:64px;height:64px}#t3{right:24px;bottom:115px;width:56px;height:56px}#t4{right:24px;top:170px;width:44px;height:44px}
</style></head><body>
<canvas id="c"></canvas><div id="fl"></div>
<div id="hud" class="hide">
<div id="st" class="p"><div class="bar"><i id="hp"></i></div><div class="bar x" style="height:6px"><i id="xp"></i></div><span id="lv"></span></div>
<div id="inf" class="p"></div><canvas id="mm" width="150" height="150"></canvas>
<div id="ob" class="p"></div><div id="sp"></div><div id="pr"></div><div id="dl" class="p"></div><div id="ts"></div></div>
<div id="tc"><div id="js"><span id="jk"></span></div><div id="t1">JUMP</div><div id="t2">E</div><div id="t3">RUN</div><div id="t4">II</div></div>
<div id="ld" class="scr" style="z-index:9"><h2>Generating city…</h2></div>
<div id="menu" class="scr hide"><h1>AURORA<b>CITY</b></h1><p>An open-world courier story — drive, explore, hunt relics and cross the river as day turns to night.</p>
<button id="bn">NEW GAME</button><button id="bc">CONTINUE</button><button id="bs">SETTINGS &amp; CONTROLS</button></div>
<div id="pause" class="scr hide"><h2>PAUSED</h2><button id="br">RESUME</button><button id="bv">SAVE GAME</button><button id="bs2">SETTINGS</button><button id="bq">QUIT TO MENU</button></div>
<div id="set" class="scr hide"><h2>SETTINGS</h2>
<label>Look sensitivity<input id="s1" type="range" min=".3" max="2" step=".1" value="1"></label>
<label>Time speed<input id="s2" type="range" min="0" max="6" step=".5" value="1"></label>
<label>Weather<select id="s3"><option value="auto">Auto</option><option value="clear">Clear</option><option value="rain">Rain</option></select></label>
<label>Shadows<input id="s4" type="checkbox" checked></label>
<label>Render scale<select id="s5"><option value=".6">Low</option><option value=".85">Medium</option><option value="1" selected>High</option></select></label>
<p>WASD move · Shift run · Space jump / handbrake · Mouse look (click to capture) · E interact / enter car · H medkit · Esc pause.<br>Touch: left stick, drag right side to look, buttons.</p><button id="bb">BACK</button></div>

